name: Build jB-Telegram-Plus (macOS)

on: [workflow_dispatch]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (uses pre-built dist/)
        run: |
          cd tauri
          cargo build --release --target aarch64-apple-darwin

      - name: Bundle .app
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: jB-Telegram-Plus-aarch64.dmg
          path: tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
