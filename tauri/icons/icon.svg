<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2AABEE"/>
      <stop offset="100%" style="stop-color:#229ED9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle (the "dictatorship bubble") -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#2AABEE" stroke-width="3"/>
  
  <!-- Broken section top-right (democracy breakthrough) -->
  <path d="M 380 80 A 240 240 0 0 1 460 200" fill="none" stroke="#0f0f23" stroke-width="8"/>
  <path d="M 380 80 A 240 240 0 0 1 460 200" fill="none" stroke="#2AABEE" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Telegram paper plane breaking through -->
  <g transform="translate(320, 140) rotate(35)">
    <!-- Plane body -->
    <path d="M 0 0 L 120 -30 L 90 40 L 60 20 L 45 60 L 30 15 L 0 0 Z" fill="url(#plane)" filter="url(#glow)"/>
    <!-- Wing -->
    <path d="M 60 20 L 90 40 L 120 -30 L 75 10 Z" fill="#1a8bc2"/>
    <!-- Tail -->
    <path d="M 45 60 L 60 20 L 75 10 L 60 50 Z" fill="#0d6a94"/>
  </g>
  
  <!-- Motion lines (speed, breaking through) -->
  <line x1="280" y1="200" x2="320" y2="180" stroke="#2AABEE" stroke-width="2" opacity="0.6"/>
  <line x1="300" y1="220" x2="340" y2="200" stroke="#2AABEE" stroke-width="2" opacity="0.4"/>
  <line x1="320" y1="240" x2="360" y2="220" stroke="#2AABEE" stroke-width="2" opacity="0.3"/>
  
  <!-- Small debris particles from breakthrough -->
  <circle cx="400" cy="120" r="3" fill="#2AABEE" opacity="0.8"/>
  <circle cx="420" cy="140" r="2" fill="#2AABEE" opacity="0.6"/>
  <circle cx="410" cy="100" r="2.5" fill="#2AABEE" opacity="0.7"/>
</svg>