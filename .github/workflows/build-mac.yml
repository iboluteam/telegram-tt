name: Build jB-Telegram-Plus (macOS)

on: [workflow_dispatch]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend (uses existing dist/)
        run: echo "Using pre-built dist/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Tauri app
        run: |
          cd tauri
          cargo build --release --target aarch64-apple-darwin

      - name: Bundle .app
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: jB-Telegram-Plus-aarch64.dmg
          path: tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
